version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/zyntra26}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - ADMIN_KEY=${ADMIN_KEY:-zyntra2026}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zyntra26
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

volumes:
  pgdata:

